version: '3.8'

services:
  # ── Streamlit UI ─────────────────────────────────────────────────────────────
  smartshopper-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartshopper-ui
    ports:
      - "8501:8501"
    # Credentials dibaca dari file .env saat runtime (TIDAK masuk ke image)
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── FastAPI REST API ──────────────────────────────────────────────────────────
  smartshopper-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: smartshopper-api
    ports:
      - "8000:8000"
    # Credentials dibaca dari file .env saat runtime (TIDAK masuk ke image)
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s